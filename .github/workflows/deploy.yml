name: Build, Test & Deploy

# Se activa solo en main. Cada microservicio se prueba/reconstruye/despliega de forma
# independiente: si un push solo toca smartstock-alert-service, únicamente ese servicio
# se reconstruye y reinicia en el servidor (mismo criterio que el flujo manual usado
# hasta ahora: "docker compose up -d --no-deps --force-recreate <service>").
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DOCKERHUB_NAMESPACE: oskyng

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            auth-service: 'smartstock-auth-service/**'
            inventory-service: 'smartstock-inventory-service/**'
            finance-service: 'smartstock-finance-service/**'
            alert-service: 'smartstock-alert-service/**'
            commerce-service: 'smartstock-commerce-service/**'
            bff-service: 'smartstock-bff-service/**'

  test-and-build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Gate: si los tests fallan, el job termina aquí y no se construye ni despliega imagen.
      - name: Run tests (smartstock-${{ matrix.service }})
        working-directory: smartstock-${{ matrix.service }}
        run: mvn -B test

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./smartstock-${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/smartstock-${{ matrix.service }}:latest
            ${{ env.DOCKERHUB_NAMESPACE }}/smartstock-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # El servidor (EC2 Amazon Linux) nunca clona el repo: solo necesita docker-compose.yml
  # (que este job mantiene sincronizado por scp) y las imágenes publicadas en Docker Hub.
  deploy:
    needs: [changes, test-and-build]
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Asegurar que exista el directorio de despliegue
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: mkdir -p "${{ secrets.DEPLOY_PATH }}"

      - name: Copiar docker-compose.yml al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Pull, recrear, health-check y rollback automático si falla
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set +e
            cd "${{ secrets.DEPLOY_PATH }}"

            # Bootstrap: crea cualquier servicio que no exista todavía (p.ej. el EC2 se reseteó
            # y quedó vacío). No reinicia los que ya están sanos, así que es seguro correrlo
            # siempre, no solo la primera vez.
            docker compose up -d

            SERVICES="${{ join(fromJson(needs.changes.outputs.services), ' ') }}"
            echo "Servicios a redesplegar: $SERVICES"

            port_for() {
              case "$1" in
                auth-service) echo 8081 ;;
                inventory-service) echo 8082 ;;
                finance-service) echo 8083 ;;
                alert-service) echo 8084 ;;
                commerce-service) echo 8085 ;;
                bff-service) echo 8080 ;;
              esac
            }

            # Guarda, por servicio, el image ID que estaba corriendo ANTES del pull, para poder
            # revertir a él si el nuevo no queda saludable. Si el servicio no existía todavía
            # (primer deploy en un EC2 recién bootstrapeado), no queda registro y no hay a qué
            # volver.
            OLD_IMAGES_FILE=$(mktemp)
            for s in $SERVICES; do
              cid=$(docker compose ps -q "$s")
              if [ -n "$cid" ]; then
                img=$(docker inspect --format='{{.Image}}' "$cid")
                echo "$s $img" >> "$OLD_IMAGES_FILE"
              fi
            done

            docker compose pull $SERVICES
            docker compose up -d --no-deps --force-recreate $SERVICES

            FAILED=""
            for s in $SERVICES; do
              port=$(port_for "$s")
              ok=0
              code="000"
              for i in $(seq 1 20); do
                sleep 5
                code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:${port}/actuator/health")
                if [ "$code" = "200" ]; then
                  ok=1
                  break
                fi
              done
              if [ "$ok" = "1" ]; then
                echo "OK: $s saludable"
              else
                echo "FALLO: $s no respondió saludable tras el deploy (último código HTTP: $code)"
                FAILED="$FAILED $s"
              fi
            done

            if [ -n "$FAILED" ]; then
              echo "Iniciando rollback automático de:$FAILED"
              for s in $FAILED; do
                old=$(grep "^$s " "$OLD_IMAGES_FILE" | awk '{print $2}')
                if [ -n "$old" ]; then
                  docker tag "$old" "oskyng/smartstock-$s:latest"
                  docker compose up -d --no-deps --force-recreate "$s"
                  echo "Revertido: $s -> $old"
                else
                  echo "Sin imagen previa registrada para $s: no se puede revertir automáticamente, revisar manualmente."
                fi
              done
            fi

            rm -f "$OLD_IMAGES_FILE"
            docker image prune -f

            if [ -n "$FAILED" ]; then
              echo "Deploy con fallas en:$FAILED (revertido cuando fue posible)"
              exit 1
            fi
