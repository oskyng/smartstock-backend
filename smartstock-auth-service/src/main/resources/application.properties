# Common Configurations
spring.application.name=smartstock-backend
spring.profiles.active=local

# JPA/Hibernate Common
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# Validation
spring.mvc.throw-exception-if-no-handler-found=true

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/smartstock.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=7

server.port=8081
spring.application.name=auth-service

smartstock.jwt.secret=smartstock_super_secret_key_2026_jwt_token_must_be_long_enough
smartstock.jwt.expiration=86400000

# Envío de correo (recuperación de contraseña). Credenciales reales via variables de entorno;
# sin ellas, el envío falla de forma segura (se loguea el error, no rompe la solicitud) porque
# EmailService corre @Async con su propio manejo de excepciones.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
