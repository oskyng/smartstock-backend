spring.application.name=inventory-service
server.port=8082

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@laboratorymanagement_high}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartstock_db}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

smartstock.jwt.secret=${SMARTSTOCK_JWT_SECRET:}
smartstock.jwt.expiration=86400000

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=smartstock-inventory-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

management.endpoints.web.exposure.include=health,info,metrics
