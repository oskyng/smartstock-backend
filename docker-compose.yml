services:
  db:
    image: gvenzl/oracle-free:latest
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=password
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: bitnami/zookeeper:latest
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes

  kafka:
    image: bitnami/kafka:latest
    depends_on:
      - zookeeper
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    ports:
      - "9092:9092"

  auth-service:
    build: ./smartstock-auth-service
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  inventory-service:
    build: ./smartstock-inventory-service
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  finance-service:
    build: ./smartstock-finance-service
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  alert-service:
    build: ./smartstock-alert-service
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  bff-service:
    build: ./smartstock-bff-service
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - inventory-service
      - finance-service
      - alert-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SMARTSTOCK_AUTH_SERVICE_URL=http://auth-service:8081
      - SMARTSTOCK_INVENTORY_SERVICE_URL=http://inventory-service:8082
      - SMARTSTOCK_FINANCE_SERVICE_URL=http://finance-service:8083
      - SMARTSTOCK_ALERT_SERVICE_URL=http://alert-service:8084
