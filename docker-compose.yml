services:
  zookeeper:
    image: zookeeper:3.9.2
    environment:
      - ZOO_ANONYMOUS_OUT_OF_CLUSTER=yes
    ports:
      - "2181:2181"

  kafka:
    image: apache/kafka:3.7.0
    depends_on:
      - zookeeper
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"

  auth-service:
    build: ./smartstock-auth-service
    image: oskyng/smartstock-auth-service:latest
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@laboratorymanagement_high
      - SPRING_DATASOURCE_USERNAME=smartstock_db
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMARTSTOCK_JWT_SECRET=${SMARTSTOCK_JWT_SECRET}
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=${GMAIL_SMTP_USERNAME:-}
      - SPRING_MAIL_PASSWORD=${GMAIL_SMTP_APP_PASSWORD:-}
      - SMARTSTOCK_ALLOWED_ORIGINS=${SMARTSTOCK_ALLOWED_ORIGINS:-http://localhost:4200}

  inventory-service:
    build: ./smartstock-inventory-service
    image: oskyng/smartstock-inventory-service:latest
    ports:
      - "8082:8082"
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@laboratorymanagement_high
      - SPRING_DATASOURCE_USERNAME=smartstock_db
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMARTSTOCK_JWT_SECRET=${SMARTSTOCK_JWT_SECRET}

  finance-service:
    build: ./smartstock-finance-service
    image: oskyng/smartstock-finance-service:latest
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@laboratorymanagement_high
      - SPRING_DATASOURCE_USERNAME=smartstock_db
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMARTSTOCK_JWT_SECRET=${SMARTSTOCK_JWT_SECRET}

  alert-service:
    build: ./smartstock-alert-service
    image: oskyng/smartstock-alert-service:latest
    ports:
      - "8084:8084"
    depends_on:
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@laboratorymanagement_high
      - SPRING_DATASOURCE_USERNAME=smartstock_db
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMARTSTOCK_JWT_SECRET=${SMARTSTOCK_JWT_SECRET}
      - SMARTSTOCK_FINANCE_URL=http://finance-service:8083

  commerce-service:
    build: ./smartstock-commerce-service
    image: oskyng/smartstock-commerce-service:latest
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@laboratorymanagement_high
      - SPRING_DATASOURCE_USERNAME=smartstock_db
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SMARTSTOCK_JWT_SECRET=${SMARTSTOCK_JWT_SECRET}

  bff-service:
    build: ./smartstock-bff-service
    image: oskyng/smartstock-bff-service:latest
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - inventory-service
      - finance-service
      - alert-service
      - commerce-service
      - kafka
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SMARTSTOCK_AUTH_SERVICE_URL=http://auth-service:8081
      - SMARTSTOCK_INVENTORY_SERVICE_URL=http://inventory-service:8082
      - SMARTSTOCK_FINANCE_SERVICE_URL=http://finance-service:8083
      - SMARTSTOCK_ALERT_SERVICE_URL=http://alert-service:8084
      - SMARTSTOCK_COMMERCE_SERVICE_URL=http://commerce-service:8085
      - SMARTSTOCK_JWT_SECRET=${SMARTSTOCK_JWT_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SMARTSTOCK_ALLOWED_ORIGINS=${SMARTSTOCK_ALLOWED_ORIGINS:-http://localhost:4200}

  frontend:
    image: oskyng/smartstock-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - bff-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
