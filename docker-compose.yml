services:
  db:
    image: gvenzl/oracle-free:latest
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=password
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5

  zookeeper:
    image: zookeeper:3.9.2
    environment:
      - ZOO_ANONYMOUS_OUT_OF_CLUSTER=yes
    ports:
      - "2181:2181"

  kafka:
    image: apache/kafka:3.7.0
    depends_on:
      - zookeeper
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    ports:
      - "9092:9092"

  auth-service:
    build: ./smartstock-auth-service
    image: oskyng/smartstock-auth-service:latest
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521/FREEPDB1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  inventory-service:
    build: ./smartstock-inventory-service
    image: oskyng/smartstock-inventory-service:latest
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521/FREEPDB1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  finance-service:
    build: ./smartstock-finance-service
    image: oskyng/smartstock-finance-service:latest
    ports:
      - "8083:8083"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521/FREEPDB1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  alert-service:
    build: ./smartstock-alert-service
    image: oskyng/smartstock-alert-service:latest
    ports:
      - "8084:8084"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@db:1521/FREEPDB1
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092

  bff-service:
    build: ./smartstock-bff-service
    image: oskyng/smartstock-bff-service:latest
    ports:
      - "8080:8080"
    depends_on:
      - auth-service
      - inventory-service
      - finance-service
      - alert-service
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SMARTSTOCK_AUTH_SERVICE_URL=http://auth-service:8081
      - SMARTSTOCK_INVENTORY_SERVICE_URL=http://inventory-service:8082
      - SMARTSTOCK_FINANCE_SERVICE_URL=http://finance-service:8083
      - SMARTSTOCK_ALERT_SERVICE_URL=http://alert-service:8084
